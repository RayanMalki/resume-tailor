services:
  - type: web
    name: resume-tailor-api
    rootDir: backend
    runtime: go
    plan: free
    buildCommand: go build -trimpath -ldflags "-s -w" -o bin/api ./cmd/api
    startCommand: ./bin/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-tailor-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://www.resumetailor.live,https://resumetailor.live"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: COOKIE_DOMAIN
        value: ".resumetailor.live"
      - key: GOOGLE_REDIRECT_URL
        value: "https://www.resumetailor.live/api/v1/auth/google/callback"
  - type: worker
    name: resume-tailor-worker
    rootDir: backend
    runtime: go
    plan: starter
    buildCommand: ./scripts/install_tectonic.sh && go build -o bin/worker ./cmd/worker
    startCommand: ./bin/worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-tailor-db
          property: connectionString
      - key: WORKER_ID
        value: "worker-1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: RESUME_PDF_ENABLED
        value: "1"
      - key: TECTONIC_BIN
        value: "./bin/tectonic"
  - type: web
    name: resume-tailor-web
    rootDir: backend/web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "/api"
      - key: API_PROXY_TARGET
        value: "https://resume-tailor-api-m106.onrender.com"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://www.resumetailor.live"
databases:
  - name: resume-tailor-db
    plan: free
