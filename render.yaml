services:
  - type: web
    name: resume-tailor-api
    rootDir: backend
    runtime: go
    plan: free
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-tailor-db
          property: connectionString
      - key: HTTP_ADDR
        value: ":$PORT"
      - key: FRONTEND_ORIGIN
        value: "https://replace-with-your-web-service-url"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
  - type: worker
    name: resume-tailor-worker
    rootDir: backend
    runtime: go
    plan: starter
    buildCommand: go build -o bin/worker ./cmd/worker
    startCommand: ./bin/worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-tailor-db
          property: connectionString
      - key: WORKER_ID
        value: "worker-1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
  - type: web
    name: resume-tailor-web
    rootDir: backend/web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
databases:
  - name: resume-tailor-db
    plan: free
